media:
  input: images/news
  output: /images/news

content:
  - name: news
    label: News
    type: file
    path: news.json
    format: json
    fields:
      - name: posts
        label: News posts
        type: object
        list: true
        fields:
          - name: title
            label: Headline
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
          - name: image
            label: Image
            type: image
          - name: image_alt
            label: Image description (for screen readers)
            type: string
          - name: text
            label: Text
            type: text
            required: true
